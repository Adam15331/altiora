<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="altiora — explore Australian university courses, ATAR requirements, and prerequisites." />
  <title>altiora — Your journey, guided.</title>

  <!-- Inter from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Data scripts loaded first so main.js can reference them -->
  <script src="data/qualificationMappings.js"></script>
  <script src="data/courseRequirements.js"></script>
</head>

<body>

  <!-- ── Navigation ─────────────────────────────────────── -->
  <nav class="nav" aria-label="Main navigation">
    <div class="nav__inner">
      <div class="nav__brand">
        <span class="nav__logo">altiora</span>
        <span class="nav__tagline">Your journey, guided.</span>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ───────────────────────────────────── -->
  <main id="main-content">

    <!-- Hero -->
    <section class="hero" aria-labelledby="hero-heading">
      <h1 id="hero-heading">Find your <span>perfect course</span>.</h1>
      <p>
        Browse Australian university courses by ATAR, prerequisites, and availability.
        Filter by what you have — discover what's possible.
      </p>
    </section>

    <!-- Filters -->
    <section aria-label="Course filters">
      <form class="filter-bar" id="filterForm" novalidate>

        <div class="filter-group">
          <label for="inputQuery">Search</label>
          <input
            type="text"
            id="inputQuery"
            name="query"
            placeholder="e.g. Medicine, Engineering…"
            autocomplete="off"
          />
        </div>

        <div class="filter-group">
          <label for="inputAtar">My ATAR (or below)</label>
          <input
            type="number"
            id="inputAtar"
            name="atar"
            min="0"
            max="100"
            step="0.05"
            placeholder="e.g. 90.00"
          />
        </div>

        <div class="filter-group">
          <label for="selectStatus">Availability</label>
          <select id="selectStatus" name="status">
            <option value="">All statuses</option>
            <option value="open">Open</option>
            <option value="limited">Limited</option>
            <option value="closed">Closed</option>
          </select>
        </div>

        <div class="filter-actions">
          <button type="submit" class="btn btn--primary">Search</button>
          <button type="button" class="btn btn--ghost" id="btnReset">Reset</button>
        </div>

      </form>
    </section>

    <!-- Course listing -->
    <section aria-labelledby="courses-heading">
      <div class="section-header">
        <h2 id="courses-heading">Courses</h2>
        <span class="count" id="resultCount" aria-live="polite" aria-atomic="true">0</span>
      </div>

      <div class="course-grid" id="courseGrid" role="list" aria-label="Course cards">
        <!-- Cards injected by main.js -->
      </div>
    </section>

  </main>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <footer class="footer">
    <p>Built by a student, for students.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
