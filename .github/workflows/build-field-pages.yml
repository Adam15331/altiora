# Regenerates the static field pages (fields/*.html), sitemap.xml and the
# index.html field-links block from data/fieldProfiles.js on every push to
# main, and commits the result if anything changed. Never runs on pull
# requests, so it can never commit to a PR branch. If the generator fails,
# the job fails before the commit step — no partial output is committed.
name: Build field pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate field pages
        run: node scripts/build-field-pages.mjs
      - name: Commit regenerated pages if changed
        run: |
          git add fields sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "Field pages already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate field pages from data/fieldProfiles.js"
          git push
