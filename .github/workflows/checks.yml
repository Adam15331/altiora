# Lint, typecheck, validate the admissions-requirements data, and run the
# tests — on every push and pull request. Read-only: never commits.
# Fails if any course is missing a requirement category or a verified
# requirement lacks a source/date (see docs/requirements-data.md).
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
